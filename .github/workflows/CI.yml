name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.conf.os }}-${{ matrix.conf.runner }}-${{ matrix.python-version }}-${{ matrix.conf.target }}
    runs-on: ${{ matrix.conf.runner }}
    strategy:
      matrix:
        python-version:
          - '3.10'
        conf:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
            os: linux
            target-triple: x86_64-unknown-linux-gnu
            docker: ghcr.io/yetsing/${{ github.repository }}/ubuntu-builder:latest
            build: |
              bash containers/build_linux.sh
            cargo_features: vulkan,window,freetype
          - runner: windows-latest
            target: x86_64
            os: windows
            target-triple: x86_64-pc-windows-msvc
            cargo_features: vulkan,window
          - runner: macos-15-intel
            target: x86_64
            os: macos
            target-triple: x86_64-apple-darwin
            cargo_features: metal,window
          - runner: macos-latest
            target: aarch64
            os: macos
            target-triple: aarch64-apple-darwin
            cargo_features: metal,window

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.conf.target-triple }}

      - name: Check ninja
        run: ninja --version

      - name: Mock docker
        if: ${{ matrix.conf.os == 'linux' }}
        run: |
          mkdir /tmp/fakebin
          # 写入假 docker wrapper
          mv containers/mock_docker.py /tmp/fakebin/docker
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> $GITHUB_PATH  # 让 PATH 优先查 fakebin

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        # if: ${{ !matrix.conf.docker }}
        with:
          target: ${{ matrix.conf.target }}
          args: -i python${{ matrix.python-version }} --release --out dist --compatibility pypi --features "${{ matrix.conf.cargo_features }}"
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.conf.manylinux }}

      # - name: Build wheels in docker
      #   uses: maus007/docker-run-action-fork@v1
      #   if: ${{ matrix.conf.docker }}
      #   with:
      #     image: ${{ matrix.conf.docker }}
      #     options: >
      #       --user 0:0
      #       -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db
      #       -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache
      #       -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index
      #       -v ${{ github.workspace }}:/build
      #       -w /build
      #       -e python_version=${{ matrix.python-version }}
      #       -e target_triple=${{ matrix.conf.target-triple }}
      #       -e cargo_features=${{ matrix.conf.cargo_features }}
      #     run: ${{ matrix.conf.build }}

      - name: Install uv
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7

      - name: Install built wheel and Test
        run: |
          uv sync
          uv pip install skia-canvas-pyr --prerelease allow --no-index --find-links dist --reinstall
          uv run pytest

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        if: ${{ ( startsWith(github.ref, 'refs/tags/') ) }}
        with:
          name: wheels-cp${{ matrix.python-version }}-${{ matrix.conf.os }}-${{ matrix.conf.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        if: ${{ ( startsWith(github.ref, 'refs/tags/') ) }}
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    # if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build_wheels, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v6
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PASSWORD }}
