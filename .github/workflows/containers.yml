name: Build containers

env:
  DOCKER_TAG: ${{ github.sha }}

on:
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push x86_64 container
      uses: docker/build-push-action@v6
      with:
        tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/builder_x86_64:latest
        context: containers
        file: containers/Dockerfile
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true

    - name: Build and push aarch64 container
      uses: docker/build-push-action@v6
      with:
        tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/builder_aarch64:latest
        context: containers
        file: containers/Dockerfile.aarch64
        platforms: linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true

    - name: Build and push musl
      uses: docker/build-push-action@v6
      with:
        tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/builder-musl:latest
        context: containers
        file: containers/Dockerfile.musl
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        push: true
