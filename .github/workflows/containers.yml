name: Build containers
on:
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix:
        conf:
          - {platform: linux/amd64, libc: glibc, manylinux: quay.io/pypa/manylinux_2_28_x86_64:latest, arch: amd64}
          - {platform: linux/arm64, libc: glibc, manylinux: quay.io/pypa/manylinux_2_28_aarch64:latest, arch: arm64}
          - {platform: linux/amd64, libc: musl, manylinux: quay.io/pypa/musllinux_1_2_x86_64:latest, arch: amd64}
          - {platform: linux/arm64, libc: musl, manylinux: quay.io/pypa/musllinux_1_2_aarch64:latest, arch: arm64}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        tags: ghcr.io/${{ github.repository }}/builder-${{ matrix.conf.arch }}-${{ matrix.conf.libc }}:latest
        context: containers
        file: containers/Dockerfile.${{ matrix.conf.libc }}
        platforms: ${{ matrix.conf.platform }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: MANYLINUX_IMAGE=${{ matrix.conf.manylinux }}
        push: true
